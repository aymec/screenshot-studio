[package]
name = "screenshot-studio"
version = "1.0.0"
description = "Create App Store and Google Play marketing screenshots: frame a phone capture, add a highlighted caption, and export store-ready PNGs."
authors = ["Aymeric Chalochet"]
license = "MIT"
repository = "https://github.com/aymec/screenshot-studio"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
